[package]
name = "ortus-mail"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Mail: store, receiving and sending, IMAP and JMAP, the inbox and compose."
repository = "https://github.com/Ortus-Sovereign-Cloud/ortus-mail"
publish = false

[dependencies]
aws-lc-rs = "1.19.0"
base64 = "0.22"
hickory-resolver = "0.26"
mail-auth = "0.15"
mail-parser = "1"
# Built from the commit in pins.toml (checked out by ci/fetch.sh), never
# from the branch: see the patch below.
ortus-core = { git = "https://github.com/Ortus-Sovereign-Cloud/ortus-core" }
# The built web client (web/dist), embedded; `npm run build` in web/ first.
rust-embed = "8.14.0"
rust-web-server = "18.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hickory-proto = "0.26"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

[patch."https://github.com/Ortus-Sovereign-Cloud/ortus-core"]
ortus-core = { path = ".deps/ortus-core" }

# Small debug builds: line numbers for our own code, no debug info for
# dependencies (a full debug build of the tests took 25 GB).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
